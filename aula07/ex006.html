<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos DOM</title>
    <style>
      div#area {
        font: normal 18pt Arial;
        background-color: rgb(17, 131, 32);
        color: white;
        font: normal 18pt Arial;
        width: 200px;
        height: 200px;
        line-height: 200px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="area">Interaja...</div>
    <script>
      var a = window.document.getElementById("area");
      a.addEventListener("click", clicar);
      a.addEventListener("mouseenter", entrar);
      a.addEventListener("mouseleave", sair);
      function clicar() {
        a.innerText = "Clicou!";
        a.style.background = "rgb(84, 84, 165)";
      }
      function entrar() {
        a.innerText = "Entrou!";
      }
      function sair() {
        a.innerText = "Saiu!";
        a.style.background = "rgb(17, 131, 32)";
      }
    </script>
  </body>
</html>
