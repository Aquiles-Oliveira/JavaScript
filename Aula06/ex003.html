<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro Programa...</title>
    <style>
        body {
            background-color: rgb(102, 100, 100);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Expedita quia voluptas fugit esse quasi magni commodi laborum sequi laudantium, consequuntur repudiandae natus nobis nemo libero sed veritatis sit, dignissimos neque?
    </p>
    <script>
        var n1 = Number(window.prompt('Digite um número:')) // string
        var n2= Number(window.prompt('Digite outro número:')) // string
        var s = n1 + n2
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`) //concatenação
        // Number + Number para adição
        // String + String para concatenação
    </script>
