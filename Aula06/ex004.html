<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
           font: normal 20pt Arial
        }
</style>
</head>
<body>
    
</body>
<script>
    var nome = window.prompt('Qual é o seu nome?')
    var idade = window.prompt('Qual é a sua idade?')
    var profissao = window.prompt('Qual é a sua profissão?')
    document.write(`Olá ${nome}! Seu nome tem ${nome.length} letras. E sua idade é ${idade} anos. E você trabalha como ${profissao}.`)
    if (idade < 18) {
        document.write('<br>Você é menor de idade.')
    } else {
        document.write('<br>Você é maior de idade.')
    }
</script>
</html>
